name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore ProductionSupportCopilot.sln --configfile NuGet.Config

      - name: Build
        run: dotnet build ProductionSupportCopilot.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ProductionSupportCopilot.sln --configuration Release --no-build --no-restore

      - name: Validate Python
        run: python -m py_compile services/ai/app.py evaluation/evaluate.py scripts/generate_handbook_pdf.py

      - name: Validate Compose
        run: docker compose config --quiet
