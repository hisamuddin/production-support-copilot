services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: support-copilot-postgres
    environment:
      POSTGRES_DB: support_copilot
      POSTGRES_USER: support_copilot
      POSTGRES_PASSWORD: local_development_only
    ports:
      - "5432:5432"
    volumes:
      - support-copilot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_copilot -d support_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  support-copilot-postgres-data:
