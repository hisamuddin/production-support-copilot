name: production-support-copilot

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: support-copilot-postgres
    environment:
      POSTGRES_DB: support_copilot
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support_copilot"]
      interval: 5s
      timeout: 3s
      retries: 15

  redpanda:
    image: redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 15

  embeddings:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    environment:
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
    ports:
      - "8001:8001"
    volumes:
      - model-cache:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: src/ProductionSupportCopilot.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=support_copilot;Username=support;Password=support_dev_password
      Database__Initialize: "true"
      Embedding__UseHttp: "true"
      Embedding__BaseUrl: http://embeddings:8001
      Kafka__Enabled: "true"
      Kafka__BootstrapServers: redpanda:29092
      Authentication__JwtKey: local-compose-key-change-before-production-123456
    ports:
      - "5051:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      embeddings:
        condition: service_healthy

volumes:
  postgres-data:
  model-cache:
