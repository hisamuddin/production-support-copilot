apiVersion: v1
kind: Namespace
metadata:
  name: support-copilot
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: support-copilot-config
  namespace: support-copilot
data:
  ASPNETCORE_URLS: http://+:8080
  Embedding__UseHttp: "true"
  Embedding__BaseUrl: http://embeddings:8001
  Kafka__Enabled: "true"
  Kafka__BootstrapServers: REPLACE_WITH_MANAGED_KAFKA
  Database__Initialize: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embeddings
  namespace: support-copilot
spec:
  replicas: 1
  selector: { matchLabels: { app: embeddings } }
  template:
    metadata: { labels: { app: embeddings } }
    spec:
      containers:
        - name: embeddings
          image: REPLACE_REGISTRY/support-copilot-embeddings:latest
          ports: [{ containerPort: 8001 }]
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "2", memory: "3Gi" }
          readinessProbe: { httpGet: { path: /health, port: 8001 }, initialDelaySeconds: 20, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: embeddings
  namespace: support-copilot
spec:
  selector: { app: embeddings }
  ports: [{ port: 8001, targetPort: 8001 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: support-copilot
spec:
  replicas: 2
  selector: { matchLabels: { app: support-copilot-api } }
  template:
    metadata: { labels: { app: support-copilot-api } }
    spec:
      containers:
        - name: api
          image: REPLACE_REGISTRY/support-copilot-api:latest
          ports: [{ containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: support-copilot-config } }]
          env:
            - name: ConnectionStrings__Postgres
              valueFrom: { secretKeyRef: { name: support-copilot-secrets, key: postgres-connection } }
            - name: Authentication__JwtKey
              valueFrom: { secretKeyRef: { name: support-copilot-secrets, key: jwt-key } }
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          readinessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 30, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: support-copilot
spec:
  type: ClusterIP
  selector: { app: support-copilot-api }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: support-copilot
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
